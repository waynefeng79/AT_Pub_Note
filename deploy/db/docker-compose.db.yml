services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgis
    image: at-pub-note-postgis:16
    command:
      [
        "postgres",
        "-c",
        "listen_addresses=*",
        "-c",
        "max_wal_size=2GB",
        "-c",
        "checkpoint_timeout=15min",
        "-c",
        "checkpoint_completion_target=0.9",
        "-c",
        "wal_compression=on",
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-at_pub_note}
      POSTGRES_USER: ${POSTGRES_USER:-at}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
